<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roomsite</title>
</head>
<body>
    <fieldset>
        <center>
            <h1>Hotel Room Booking Form</h1>
            <form action="#">
                <label for="fullname">Full Name:</label>
                <input type="name" name="name" id="name" placeholder="Enter your full name ">
                <br><br>
                <label for="Email">Email:</label>
                <input type="Email" id="Email" name="Email" placeholder="Enter your Email">
                <br><br>
                <label for="Phone">Phone:</label>
                <input type="phone" name="phone" id="phone" placeholder="Enter your Mobile number">
                <br><br>
                <label for="dob">Check in date:</label>
                <input type="date" name="date" id="date" placeholder="Check in Date">
                <br><br>
                <label for="dob">Check out date:</label>
                <input type="date" name="date" id="date" palceholder="check out date">
                <br><br>
                <label for="Room type">Room type:</label>
                <select name="Room" id="Room">
                    <option value="Single Seater">Single Seater</option>
                    <option value="Double Seater">Double Seater</option>
                    <option value="Triple Seater">Triple Seater</option>

                </select>
                <br><br>
                <label for="Number of Guest">Number of Guest:</label>
                <input type="Guest" id="Guest" name="guest" placeholder="Number of guest">
                <br><br>
                Special Request:
                <br>
                <textarea  rows="4" cols="35" name="" id=""></textarea>
                <br><br>
                <input type="submit" value="Book Now">
                <input type="reset" value="Reset Now">

            </form>
        </center>
    </fieldset>
</body>
</html>
